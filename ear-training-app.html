// ─── PIANO SAMPLER SINGLETON ──────────────────────────────────────────────────

let pianoSampler = null;
let samplerReady = false;
let samplerLoading = false;

// Uses Tone.js Salamander piano samples via GitHub CDN
function getPianoSampler() {
  if (pianoSampler) return Promise.resolve(pianoSampler);
  if (samplerLoading) {
    return new Promise(resolve => {
      const check = setInterval(() => {
        if (samplerReady) { clearInterval(check); resolve(pianoSampler); }
      }, 100);
    });
  }
  samplerLoading = true;
  return new Promise((resolve, reject) => {
    pianoSampler = new Tone.Sampler({
      urls: {
        A0: 'A0.mp3', C1: 'C1.mp3', 'D#1': 'Ds1.mp3', 'F#1': 'Fs1.mp3',
        A1: 'A1.mp3', C2: 'C2.mp3', 'D#2': 'Ds2.mp3', 'F#2': 'Fs2.mp3',
        A2: 'A2.mp3', C3: 'C3.mp3', 'D#3': 'Ds3.mp3', 'F#3': 'Fs3.mp3',
        A3: 'A3.mp3', C4: 'C4.mp3', 'D#4': 'Ds4.mp3', 'F#4': 'Fs4.mp3',
        A4: 'A4.mp3', C5: 'C5.mp3', 'D#5': 'Ds5.mp3', 'F#5': 'Fs5.mp3',
        A5: 'A5.mp3', C6: 'C6.mp3', 'D#6': 'Ds6.mp3', 'F#6': 'Fs6.mp3',
        A6: 'A6.mp3', C7: 'C7.mp3', 'D#7': 'Ds7.mp3', 'F#7': 'Fs7.mp3',
        A7: 'A7.mp3', C8: 'C8.mp3',
      },
      release: 1.2,
      baseUrl: 'https://tonejs.github.io/audio/salamander/',
      onload: () => {
        samplerReady = true;
        samplerLoading = false;
        resolve(pianoSampler);
      },
      onerror: (err) => {
        samplerLoading = false;
        reject(err);
      }
    }).toDestination();
  });
}

// Convert note name like "C#4" to MIDI number
function noteToMidi(note) {
  const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const match = note.match(/^([A-G]#?)(\d)$/);
  if (!match) return null;
  const pitch = noteNames.indexOf(match[1]);
  const octave = parseInt(match[2]);
  return pitch + (octave + 1) * 12;
}

// Convert MIDI number back to note name
function midiToNote(midi) {
  const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const octave = Math.floor(midi / 12) - 1;
  const pitch = midi % 12;
  return noteNames[pitch] + octave;
}

// ─── LOGO ─────────────────────────────────────────────────────────────────────
const LOGO_URL = 'https://static.wixstatic.com/media/3595a0_7dd07b5a57e046eb8ba30ea2e1a49edd~mv2.png';

// ─── PDF EXPORT ───────────────────────────────────────────────────────────────

async function exportToPDF(practiceLog, count, mode) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const attemptsToExport = practiceLog.slice(-count);
  const correctCount = attemptsToExport.filter(l => l.correct).length;
  const accuracy = ((correctCount / count) * 100).toFixed(1);
  const modeLabel = mode === 'interval' ? 'Interval Training' : 'Chord Training';

  try {
    const logoImg = new Image();
    logoImg.crossOrigin = 'anonymous';
    logoImg.src = LOGO_URL;
    await new Promise(resolve => {
      logoImg.onload = () => {
        const lw = 50, lh = 30, xPos = (doc.internal.pageSize.width - lw) / 2;
        doc.addImage(logoImg, 'PNG', xPos, 10, lw, lh);
        resolve();
      };
      logoImg.onerror = () => resolve();
    });
  } catch {}

  doc.setFontSize(20);
  doc.setFont(undefined, 'bold');
  doc.text(modeLabel + ' Practice Report', 105, 45, { align: 'center' });
  doc.setFontSize(10);
  doc.setFont(undefined, 'normal');
  const now = new Date();
  doc.text(now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) + ' at ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }), 105, 52, { align: 'center' });

  doc.setFillColor(240, 248, 255);
  doc.roundedRect(20, 60, 170, 25, 3, 3, 'F');
  doc.setFontSize(12);
  doc.setFont(undefined, 'bold');
  doc.text('Practice Summary (Last ' + count + ' Attempts)', 105, 70, { align: 'center' });
  doc.setFont(undefined, 'normal');
  doc.text('Correct: ' + correctCount + ' / ' + count, 105, 77, { align: 'center' });
  doc.setFontSize(14);
  doc.setFont(undefined, 'bold');
  doc.setTextColor(correctCount >= count * 0.7 ? 0 : 220, correctCount >= count * 0.7 ? 128 : 20, correctCount >= count * 0.7 ? 0 : 60);
  doc.text('Accuracy: ' + accuracy + '%', 105, 84, { align: 'center' });
  doc.setTextColor(0, 0, 0);

  let yPos = 100;
  doc.setFontSize(10);
  doc.setFont(undefined, 'bold');
  doc.setFillColor(27, 38, 59);
  doc.setTextColor(255, 255, 255);
  doc.rect(20, yPos, 170, 8, 'F');
  doc.text('#', 25, yPos + 5);
  doc.text(mode === 'interval' ? 'Interval' : 'Chord', 40, yPos + 5);
  if (mode === 'interval') doc.text('Direction', 90, yPos + 5);
  doc.text('Your Answer', mode === 'interval' ? 125 : 110, yPos + 5);
  doc.text('Result', 175, yPos + 5);
  yPos += 10;
  doc.setTextColor(0, 0, 0);
  doc.setFont(undefined, 'normal');

  attemptsToExport.forEach((log, index) => {
    if (yPos > 270) { doc.addPage(); yPos = 20; }
    if (index % 2 === 0) {
      doc.setFillColor(244, 246, 249);
      doc.rect(20, yPos - 4, 170, 8, 'F');
    }
    doc.text(String(index + 1), 25, yPos);
    const nameStr = (log.name || log.interval || '').substring(0, 28);
    doc.text(nameStr, 40, yPos);
    if (mode === 'interval') doc.text(log.direction || '', 90, yPos);
    const answerStr = (log.userAnswer || 'No answer').substring(0, 28);
    doc.text(answerStr, mode === 'interval' ? 125 : 110, yPos);
    doc.setTextColor(log.correct ? 26 : 146, log.correct ? 102 : 43, log.correct ? 64 : 43);
    doc.text(log.correct ? 'Correct' : 'Wrong', 175, yPos);
    doc.setTextColor(0, 0, 0);
    yPos += 8;
  });

  doc.setFontSize(8);
  doc.setTextColor(119, 141, 169);
  doc.text('Generated by Ear Training App', 105, 275, { align: 'center' });
  doc.text('103-80 Acadia Ave., Markham, Ontario L3R 9V1', 105, 280, { align: 'center' });
  doc.text('Tel: (905)415-7772 | Email: info@SymphonicMusic.Institute', 105, 285, { align: 'center' });

  // Unique filename: mode + datetime stamp
  const ts = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = ts.getFullYear() + pad(ts.getMonth()+1) + pad(ts.getDate()) + '-' + pad(ts.getHours()) + pad(ts.getMinutes()) + pad(ts.getSeconds());
  doc.save('ear-training-' + mode + '-' + stamp + '.pdf');
}

// ─── EXPORT BUTTON (shared) ───────────────────────────────────────────────────

function ExportButton({ practiceLog, mode }) {
  const [showExport, setShowExport] = useState(false);
  const wrapRef = useRef(null);

  // Close on outside click
  useEffect(() => {
    if (!showExport) return;
    const handler = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setShowExport(false);
      }
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [showExport]);

  return (
    <div ref={wrapRef} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', position: 'relative' }}>
      <button
        className="btn-secondary"
        style={{ borderColor: '#415A77', color: '#415A77' }}
        disabled={practiceLog.length === 0}
        onClick={() => setShowExport(v => !v)}
      >
        Show off to my teacher
      </button>

      {showExport && practiceLog.length > 0 && (
        <div className="export-dropdown" style={{ position: 'absolute', top: '100%', left: '50%', transform: 'translateX(-50%)', marginTop: 6 }}>
          <p style={{ margin: 0 }}>Export last:</p>
          {[5, 10, 20].map(n => (
            <button
              key={n}
              disabled={practiceLog.length < n}
              onClick={() => { exportToPDF(practiceLog, n, mode); setShowExport(false); }}
            >
              {n} attempts {practiceLog.length < n ? `(need ${n - practiceLog.length} more)` : ''}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

  const generateQuestion = () => {
    const iv = selected[Math.floor(Math.random() * selected.length)];
    const dir = direction === 'both' ? (Math.random() > 0.5 ? 'ascending' : 'descending') : direction;
    let validNote;
    for (let i = 0; i < 100; i++) {
      const candidate = ALL_NOTES[Math.floor(Math.random() * ALL_NOTES.length)];
      const idx = ALL_NOTES.indexOf(candidate);
      const second = dir === 'ascending' ? idx + iv.semitones : idx - iv.semitones;
      if (second >= 0 && second < ALL_NOTES.length) { validNote = candidate; break; }
    }
    setCurrentNote(validNote || 'C4');
    setCurrentInterval(iv);
    setCurrentDir(dir);
    setUserAnswer('');
    setShowResult(false);
    setIsCorrect(false);
  };

  const startPractice = () => {
    if (selected.length === 0) { setShowWarning(true); return; }
    generateQuestion();
    setPage('practice');
  };

  const playInterval = async () => {
    if (!currentNote || !currentInterval || isPlaying) return;
    setIsPlaying(true);
    setSamplerStatus('loading');
    try {
      await Tone.start();
      const sampler = await getPianoSampler();
      setSamplerStatus('ready');
      const rootMidi = noteToMidi(currentNote);
      const secondMidi = currentDir === 'ascending' ? rootMidi + currentInterval.semitones : rootMidi - currentInterval.semitones;
      const note1 = currentNote;
      const note2 = midiToNote(secondMidi);
      const now = Tone.now();
      sampler.triggerAttackRelease(note1, '2n', now);
      sampler.triggerAttackRelease(note2, '2n', now + 1.1);
      setTimeout(() => { setIsPlaying(false); }, 3500);
    } catch (e) {
      console.error(e);
      setSamplerStatus('error');
      setIsPlaying(false);
    }
  };

  const checkAnswer = () => {
    if (!userAnswer) return;
    const correct = userAnswer === currentInterval.name;
    setIsCorrect(correct);
    setShowResult(true);
    setPracticeLog(prev => [...prev, {
      timestamp: new Date().toISOString(),
      interval: currentInterval.name,
      direction: currentDir,
      userAnswer,
      correct
    }].slice(-50));
  };

  if (page === 'settings') {
    return (
      <div className="app-bg" style={{ minHeight: '100vh', padding: '32px 16px' }}>
        <div style={{ maxWidth: 600, margin: '0 auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 32 }}>
            <button className="btn-secondary" onClick={onBack}>← Back</button>
            <h1 style={{ color: '#1B263B', fontSize: 26, margin: 0 }}>Interval Training</h1>
          </div>

          <div className="card" style={{ padding: 28, marginBottom: 20 }}>
            <div className="section-label">Select Intervals</div>
            <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
              <button className="btn-secondary" style={{ fontSize: 12 }} onClick={() => { setSelected([...INTERVALS]); setShowWarning(false); }}>Select All</button>
              <button className="btn-secondary" style={{ fontSize: 12 }} onClick={() => setSelected([])}>Clear</button>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 2 }}>
              {INTERVALS.map(iv => (
                <label className="checkbox-row" key={iv.name}>
                  <input type="checkbox" checked={selected.includes(iv)} onChange={() => toggle(iv)} />
                  <span>{iv.name}</span>
                </label>
              ))}
            </div>
          </div>

          <div className="card" style={{ padding: 28, marginBottom: 20 }}>
            <div className="section-label">Direction</div>
            {[['ascending','Ascending only'],['descending','Descending only'],['both','Mix (Ascending & Descending)']].map(([val,label]) => (
              <label className="radio-row" key={val}>
                <input type="radio" name="dir" value={val} checked={direction === val} onChange={e => setDirection(e.target.value)} />
                <span>{label}</span>
              </label>
            ))}
          </div>

          {showWarning && <div className="warning-box">Please select at least one interval.</div>}
          <button className="btn-primary" style={{ width: '100%', padding: '14px' }} onClick={startPractice}>Begin Practice</button>
        </div>
      </div>
    );
  }

  return (
    <div className="app-bg" style={{ minHeight: '100vh', padding: '32px 16px' }}>
      <div style={{ maxWidth: 560, margin: '0 auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 32 }}>
          <h1 style={{ color: '#1B263B', fontSize: 26, margin: 0 }}>Practice Mode</h1>
          <button className="btn-secondary" onClick={() => { setPage('settings'); setShowResult(false); }}>← Quit</button>
        </div>

        <div className="card" style={{ padding: 36, marginBottom: 20, textAlign: 'center' }}>
          <button className="btn-play" style={{ margin: '0 auto' }} onClick={playInterval} disabled={isPlaying}>
            <span>{isPlaying ? 'Playing...' : 'Play Interval'}</span>
          </button>
          {samplerStatus === 'loading' && <p className="loading-hint">Loading piano samples…</p>}
          {samplerStatus === 'error'   && <p className="loading-hint" style={{ color: '#922b2b' }}>Could not load piano samples.</p>}
        </div>

        <div className="card" style={{ padding: 28, marginBottom: 20 }}>
          <label style={{ display: 'block', color: '#778DA9', fontSize: 12, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10 }}>Your Answer</label>
          <select className="answer-select" value={userAnswer} onChange={e => setUserAnswer(e.target.value)} disabled={showResult}>
            <option value="">— Select Interval —</option>
            {selected.map(iv => <option key={iv.name} value={iv.name}>{iv.name}</option>)}
          </select>
        </div>

        {!showResult ? (
          <button className="btn-primary" style={{ width: '100%', padding: '14px' }} onClick={checkAnswer} disabled={!userAnswer}>
            Submit Answer
          </button>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div className={isCorrect ? 'result-correct' : 'result-wrong'}>
              <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 6 }}>{isCorrect ? 'Correct!' : 'Incorrect'}</div>
              <div style={{ fontSize: 14, opacity: 0.85 }}>
                Answer: <strong>{currentInterval.name}</strong> ({currentDir})
              </div>
            </div>
            <button className="btn-primary" style={{ width: '100%', padding: '14px' }} onClick={generateQuestion}>Next Question</button>
          </div>
        )}

        <hr className="divider" />
        <ExportButton practiceLog={practiceLog} mode="interval" />
      </div>
    </div>
  );
}

// ─── CHORD TRAINING ───────────────────────────────────────────────────────────

function ChordTraining({ onBack }) {
  const [page, setPage] = useState('settings');
  const [selectedKeys, setSelectedKeys] = useState([]);
  const [showWarning, setShowWarning] = useState(false);
  const [currentVoicing, setCurrentVoicing] = useState(null); // { label, semitones }
  const [currentRoot, setCurrentRoot] = useState(null);
  const [userAnswer, setUserAnswer] = useState('');
  const [showResult, setShowResult] = useState(false);
  const [isCorrect, setIsCorrect] = useState(false);
  const [isPlaying, setIsPlaying] = useState(false);
  const [samplerStatus, setSamplerStatus] = useState('idle');
  const [practiceLog, setPracticeLog] = useState([]);

  // Build flat list of available answer options from selected chords
  const answerOptions = CHORDS
    .filter(c => selectedKeys.includes(c.key))
    .flatMap(c => c.voicings.map(v => v.label));

  const toggleChord = (key) => {
    setSelectedKeys(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]);
    setShowWarning(false);
  };

  const generateQuestion = () => {
    // Gather all voicings from selected chords
    const pool = CHORDS
      .filter(c => selectedKeys.includes(c.key))
      .flatMap(c => c.voicings);
    const voicing = pool[Math.floor(Math.random() * pool.length)];

    // Find a root note where all chord tones fit in range
    const maxSemitone = Math.max(...voicing.semitones);
    let validRoot;
    for (let i = 0; i < 200; i++) {
      const candidate = ALL_NOTES[Math.floor(Math.random() * ALL_NOTES.length)];
      const rootMidi = noteToMidi(candidate);
      const topMidi = rootMidi + maxSemitone;
      const topNote = midiToNote(topMidi);
      if (ALL_NOTES.includes(topNote)) { validRoot = candidate; break; }
    }
    setCurrentRoot(validRoot || 'C4');
    setCurrentVoicing(voicing);
    setUserAnswer('');
    setShowResult(false);
    setIsCorrect(false);
  };

  const startPractice = () => {
    if (selectedKeys.length === 0) { setShowWarning(true); return; }
    generateQuestion();
    setPage('practice');
  };

  const playChord = async () => {
    if (!currentRoot || !currentVoicing || isPlaying) return;
    setIsPlaying(true);
    setSamplerStatus('loading');
    try {
      await Tone.start();
      const sampler = await getPianoSampler();
      setSamplerStatus('ready');
      const rootMidi = noteToMidi(currentRoot);
      const notes = currentVoicing.semitones.map(s => midiToNote(rootMidi + s));
      const now = Tone.now();
      sampler.triggerAttackRelease(notes, '2', now);
      setTimeout(() => { setIsPlaying(false); }, 3000);
    } catch (e) {
      console.error(e);
      setSamplerStatus('error');
      setIsPlaying(false);
    }
  };

  const checkAnswer = () => {
    if (!userAnswer) return;
    const correct = userAnswer === currentVoicing.label;
    setIsCorrect(correct);
    setShowResult(true);
    setPracticeLog(prev => [...prev, {
      timestamp: new Date().toISOString(),
      name: currentVoicing.label,
      userAnswer,
      correct
    }].slice(-50));
  };

  if (page === 'settings') {
    return (
      <div className="app-bg" style={{ minHeight: '100vh', padding: '32px 16px' }}>
        <div style={{ maxWidth: 600, margin: '0 auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 32 }}>
            <button className="btn-secondary" onClick={onBack}>← Back</button>
            <h1 style={{ color: '#1B263B', fontSize: 26, margin: 0 }}>Chord Training</h1>
          </div>

          <div className="card" style={{ padding: 28, marginBottom: 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
              <div className="section-label" style={{ margin: 0 }}>Select Chords</div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="btn-secondary" style={{ fontSize: 12 }} onClick={() => { setSelectedKeys(CHORDS.map(c => c.key)); setShowWarning(false); }}>Select All</button>
                <button className="btn-secondary" style={{ fontSize: 12 }} onClick={() => setSelectedKeys([])}>Clear</button>
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 2 }}>
              {CHORDS.map(chord => (
                <label className="checkbox-row" key={chord.key}>
                  <input type="checkbox" checked={selectedKeys.includes(chord.key)} onChange={() => toggleChord(chord.key)} />
                  <span>
                    {chord.name}
                    {chord.badge && <span className="tag-badge">{chord.badge}</span>}
                  </span>
                </label>
              ))}
            </div>
            <div style={{ marginTop: 14, padding: '10px 12px', background: 'rgba(65,90,119,0.08)', borderRadius: 8, fontSize: 12, color: '#415A77', lineHeight: 1.6 }}>
              Note: Chords marked <span style={{ color: '#1B263B', fontWeight: 600 }}>Root &amp; 1st Inv.</span> play both voicings randomly, identify which one you hear.
            </div>
          </div>

          {showWarning && <div className="warning-box">Please select at least one chord type.</div>}
          <button className="btn-primary" style={{ width: '100%', padding: '14px' }} onClick={startPractice}>Begin Practice</button>
        </div>
      </div>
    );
  }

  return (
    <div className="app-bg" style={{ minHeight: '100vh', padding: '32px 16px' }}>
      <div style={{ maxWidth: 560, margin: '0 auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 32 }}>
          <h1 style={{ color: '#1B263B', fontSize: 26, margin: 0 }}>Practice Mode</h1>
          <button className="btn-secondary" onClick={() => { setPage('settings'); setShowResult(false); }}>← Quit</button>
        </div>

        <div className="card" style={{ padding: 36, marginBottom: 20, textAlign: 'center' }}>
          <button className="btn-play" style={{ margin: '0 auto' }} onClick={playChord} disabled={isPlaying}>
            <span>{isPlaying ? 'Playing...' : 'Play Chord'}</span>
          </button>
          {samplerStatus === 'loading' && <p className="loading-hint">Loading piano samples…</p>}
          {samplerStatus === 'error'   && <p className="loading-hint" style={{ color: '#922b2b' }}>Could not load piano samples.</p>}
        </div>

        <div className="card" style={{ padding: 28, marginBottom: 20 }}>
          <label style={{ display: 'block', color: '#778DA9', fontSize: 12, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10 }}>Your Answer</label>
          <select className="answer-select" value={userAnswer} onChange={e => setUserAnswer(e.target.value)} disabled={showResult}>
            <option value="">— Select Chord —</option>
            {answerOptions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
          </select>
        </div>

        {!showResult ? (
          <button className="btn-primary" style={{ width: '100%', padding: '14px' }} onClick={checkAnswer} disabled={!userAnswer}>
            Submit Answer
          </button>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div className={isCorrect ? 'result-correct' : 'result-wrong'}>
              <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 6 }}>{isCorrect ? 'Correct!' : 'Incorrect'}</div>
              <div style={{ fontSize: 14, opacity: 0.85 }}>
                Answer: <strong>{currentVoicing.label}</strong>
              </div>
            </div>
            <button className="btn-primary" style={{ width: '100%', padding: '14px' }} onClick={generateQuestion}>Next Question</button>
          </div>
        )}

        <hr className="divider" />
        <ExportButton practiceLog={practiceLog} mode="chord" />
      </div>
    </div>
  );
}

// ─── ROOT APP ────────────────────────────────────────────────────────────────

function App() {
  const [mode, setMode] = useState('home'); // 'home' | 'interval' | 'chord'
  if (mode === 'home')     return <HomeScreen onSelect={setMode} />;
  if (mode === 'interval') return <IntervalTraining onBack={() => setMode('home')} />;
  if (mode === 'chord')    return <ChordTraining onBack={() => setMode('home')} />;
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App />);
</script>
